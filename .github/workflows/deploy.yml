name: Deploy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy the selected ref to
        type: choice
        options: [dev, prod]
        default: dev
      reset_db:
        description: 'DEV ONLY: drop all tables and migrate from scratch (all data is lost)'
        type: boolean
        default: false
      rollback_to:
        description: 'DEV ONLY: roll back all migrations applied after this one (e.g. 0009_foo) before migrating; needs down files; data of rolled back migrations is lost'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.env || 'dev' }}
  cancel-in-progress: false

jobs:
  dev:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: dev
      reset_db: ${{ inputs.reset_db == true }}
      rollback_to: ${{ inputs.rollback_to }}

  # Prod only deploys commits that are on main and passed CI.
  pruefen:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not contained in main; prod deploys only commits on main."
            exit 1
          fi
      - name: CI must have succeeded for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OK=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')
          if [ "$OK" -lt 1 ]; then
            echo "::error::No successful CI check run (job 'check' of ci.yml) found for commit $GITHUB_SHA."
            exit 1
          fi

  prod:
    needs: pruefen
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: prod
